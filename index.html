<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=Inter:wght@400;500&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0D; --card:#131318; --card2:#1A1A21;
  --line:#242430; --line2:#31313E;
  --tx:#F4F4F6; --tx2:#9A9AA8; --tx3:#63636F;
  --gold:#D9B36C; --goldbg:#3A2F1C;
  --mint:#7BE0A8; --mintbg:#12291F;
  --amber:#F0B44A; --amberbg:#2E2413;
  --rose:#FF8080; --rosebg:#2E1717;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx)}
body{font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;
  line-height:1.6;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(90px + env(safe-area-inset-bottom))}

.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;
  justify-content:space-between;gap:8px;padding:9px 12px;
  background:rgba(10,10,13,.85);backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.mark{width:22px;height:22px;border-radius:7px;flex:none;
  background:linear-gradient(140deg,#D9B36C,#8C6B32);display:grid;
  place-items:center;font-family:Sora,sans-serif;font-size:11px;
  font-weight:600;color:#1A1408}
.brand b{font-family:Sora,sans-serif;font-size:12px;font-weight:500;
  letter-spacing:.18em;text-transform:uppercase}
@media(max-width:430px){.brand b{display:none}}
.pills{display:flex;gap:4px;align-items:center;flex:none}
.pill{display:flex;align-items:baseline;gap:3px;padding:5px 7px;
  border-radius:100px;border:1px solid transparent;background:none;
  font-family:inherit;cursor:pointer}
.pill b{font-family:Sora,sans-serif;font-size:12.5px;font-weight:600;line-height:1}
.pill span{font-size:8.5px;letter-spacing:.04em;text-transform:uppercase}
.pill:active{transform:scale(.96)}
@media(max-width:400px){
  .pill{padding:4px 6px;gap:2px}
  .pill span{font-size:8px;letter-spacing:0}
  .pill b{font-size:12px}
}
.p-gold{background:var(--goldbg);border-color:#4E3F24}
.p-gold b{color:var(--gold)} .p-gold span{color:#A98A50}
.p-amber{background:var(--amberbg);border-color:#4A3A18}
.p-amber b{color:var(--amber)} .p-amber span{color:#B08A44}
.p-rose{background:var(--rosebg);border-color:#4A2020}
.p-rose b{color:var(--rose)} .p-rose span{color:#B26565}
.p-mint{background:var(--mintbg);border-color:#235C40}
.p-mint b{color:var(--mint)} .p-mint span{color:#5C9C7B}
.p-cyan{background:#0E2A2E;border-color:#1E4A50}
.p-cyan b{color:#6FD8E0} .p-cyan span{color:#4E9098}
.pill.sel{box-shadow:0 0 0 1px currentColor}
.sync{width:28px;height:28px;border-radius:9px;cursor:pointer;flex:none;
  background:var(--card2);border:1px solid var(--line2);color:var(--tx2);
  font-size:14px;line-height:1;padding:0;display:grid;place-items:center}
.sync:hover{border-color:var(--gold);color:var(--gold)}
.sync.busy{opacity:.5;pointer-events:none}

.rail{display:flex;gap:5px;padding:13px 16px 0;max-width:1120px;margin:0 auto}
.rail i{flex:1;height:3px;border-radius:2px;background:var(--line2)}
.rail i.done{background:#4A4A5A}
.rail i.now{background:var(--gold)}

.shell{max-width:1120px;margin:0 auto;padding:16px}

.state{text-align:center;padding:60px 20px;color:var(--tx2)}
.state h3{font-family:Sora,sans-serif;font-size:18px;font-weight:500;
  color:var(--tx);margin:0 0 8px}
.state code{font-family:'JetBrains Mono',monospace;font-size:11px;
  color:var(--tx3);word-break:break-all;display:block;margin-top:14px}
.retry{margin-top:18px;background:none;border:1px solid var(--line2);
  color:var(--tx);border-radius:11px;padding:10px 18px;cursor:pointer;
  font-family:Sora,sans-serif;font-size:13px}
.retry:hover{border-color:var(--gold);color:var(--gold)}

.who{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}
.pic{width:42px;height:42px;border-radius:14px;flex:none;background:var(--card2);
  border:1px solid var(--line2);display:grid;place-items:center;
  font-family:Sora,sans-serif;font-size:14px;font-weight:600;color:var(--gold)}
.whotx{min-width:0;flex:1}
.name{font-family:Sora,sans-serif;font-size:18px;font-weight:600;
  letter-spacing:-.01em;margin:0;line-height:1.3}
.role{font-size:12.5px;color:var(--tx2);margin:2px 0 0;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.meta{display:flex;align-items:center;gap:9px;margin-top:8px;flex-wrap:wrap}
.when{font-size:11.5px;color:var(--tx3)}

.fit{display:inline-flex;align-items:center;gap:7px;padding:3px 9px 3px 8px;
  border-radius:100px;background:var(--card2);border:1px solid var(--line2)}
.seg{display:flex;gap:2px}
.seg i{width:6px;height:11px;border-radius:2px;background:#2E2E3A;
  border:1px solid #3B3B49;display:block}
.seg i.on{border-color:transparent}
.fitn{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:-.02em}
.fitn small{color:var(--tx3);font-size:10px}

.grid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:900px){
  .grid{grid-template-columns:minmax(0,504px) minmax(0,1fr);gap:22px;align-items:start}
  .right{position:sticky;top:66px}
}

.panel{background:var(--card);border:1px solid var(--line);
  border-radius:18px;overflow:hidden;margin-bottom:16px}
.panel:last-child{margin-bottom:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 14px;border-bottom:1px solid var(--line)}
.ph > span{font-family:Sora,sans-serif;font-size:10.5px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;color:var(--tx3)}
.pb{padding:16px}

.size{display:flex;align-items:center;gap:6px}
.size button{width:26px;height:26px;border-radius:8px;cursor:pointer;
  background:var(--card2);border:1px solid var(--line2);color:var(--tx2);
  font-family:Sora,sans-serif;font-size:14px;line-height:1;padding:0;
  display:grid;place-items:center}
.size button:hover{border-color:var(--gold);color:var(--gold)}
.size em{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--tx3);
  font-style:normal;min-width:34px;text-align:center}

.framewrap{padding:10px;background:var(--card2)}
.frame{width:100%;border:0;display:block;background:var(--card2);border-radius:10px}
.why{font-size:14.5px;margin:0}

textarea{width:100%;min-height:132px;resize:vertical;display:block;padding:14px;
  border-radius:14px;border:1px solid var(--line2);background:var(--card2);
  color:var(--tx);font-family:Inter,sans-serif;font-size:15px;line-height:1.65}
textarea:focus{outline:none;border-color:var(--gold);background:#1E1E26}
.cnt{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--tx3)}
.cnt.over{color:var(--rose)}

.said{font-size:15px;line-height:1.65;margin:0;padding:14px;
  background:var(--card2);border-radius:14px;border:1px solid var(--line2);
  white-space:pre-wrap}
.wasdraft{font-size:13.5px;color:var(--tx2);margin:12px 0 0;padding:12px 14px;
  background:#101015;border-radius:12px;border:1px dashed var(--line2);
  white-space:pre-wrap}
.wasdraft b{display:block;font-family:Sora,sans-serif;font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);
  margin-bottom:6px;font-weight:500}

.post{font-size:14.5px;white-space:pre-wrap;color:var(--tx2);display:none;
  padding:0 16px 16px}
.post.open{display:block}
.toggle{width:100%;background:none;border:0;cursor:pointer;padding:13px 16px;
  display:flex;align-items:center;justify-content:space-between;
  font-family:Sora,sans-serif;font-size:10.5px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;color:var(--tx3)}
.toggle b{font-size:15px;color:var(--gold);line-height:1}

.urn{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--tx3);
  word-break:break-all;padding:12px 16px;border-top:1px solid var(--line)}

.golink{display:inline-flex;align-items:center;gap:7px;text-decoration:none;
  background:var(--mintbg);border:1px solid #235C40;color:var(--mint);
  border-radius:12px;padding:11px 16px;font-family:Sora,sans-serif;
  font-size:13px;font-weight:500;margin-top:14px}
.golink:hover{filter:brightness(1.1)}
.postrow{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.pbtn{font-family:Sora,sans-serif;font-size:13px;font-weight:500;cursor:pointer;
  border-radius:12px;padding:11px 16px;border:1px solid transparent}
.pbtn:active{transform:scale(.97)}
.pbtn:disabled{opacity:.5;pointer-events:none}
.pcopy{flex:1;background:var(--mint);color:#062015;font-weight:600}
.pmark{background:var(--card2);color:var(--tx2);border-color:var(--line2)}
.pmark:hover{border-color:var(--mint);color:var(--mint)}
.donetag{display:inline-flex;align-items:center;padding:11px 16px;
  font-family:Sora,sans-serif;font-size:13px;font-weight:500;
  color:var(--mint);background:var(--mintbg);border:1px solid #235C40;
  border-radius:12px}
.posthint{font-size:12px;color:var(--tx3);margin:10px 0 0;line-height:1.5}
.modal-back{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);
  backdrop-filter:blur(3px);display:flex;align-items:flex-end;
  justify-content:center;padding:0}
@media(min-width:600px){.modal-back{align-items:center;padding:20px}}
.modal{background:var(--card);border:1px solid var(--line2);
  border-radius:20px 20px 0 0;width:100%;max-width:560px;padding:20px 18px 24px;
  animation:slideup .2s ease}
@media(min-width:600px){.modal{border-radius:18px}}
@keyframes slideup{from{transform:translateY(30px);opacity:.6}to{transform:translateY(0);opacity:1}}
.modal-h{font-family:Sora,sans-serif;font-size:17px;font-weight:600;margin-bottom:4px}
.modal-sub{font-size:12.5px;color:var(--tx2);margin:0 0 14px;line-height:1.5}
.modal-draft{font-size:13.5px;color:var(--tx2);background:var(--card2);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  margin-bottom:12px;white-space:pre-wrap;line-height:1.55}
#rwnote{width:100%;min-height:96px;resize:vertical;padding:13px;border-radius:13px;
  border:1px solid var(--line2);background:var(--card2);color:var(--tx);
  font-family:Inter,sans-serif;font-size:15px;line-height:1.6}
#rwnote:focus{outline:none;border-color:var(--gold)}
.modal-row{display:flex;gap:9px;margin-top:14px}
.mbtn{font-family:Sora,sans-serif;font-size:14px;font-weight:500;cursor:pointer;
  border-radius:13px;padding:13px 16px;border:1px solid transparent}
.mcancel{background:var(--card2);color:var(--tx2);border-color:var(--line2)}
.msend{flex:1;background:var(--amber);color:#241a06;font-weight:600}
.mbtn:disabled{opacity:.5;pointer-events:none}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:50;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:rgba(10,10,13,.92);backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.barin{max-width:1120px;margin:0 auto;display:flex;gap:8px}
.btn{font-family:Sora,sans-serif;font-size:13.5px;font-weight:500;cursor:pointer;
  border-radius:13px;border:1px solid transparent;padding:13px 14px;display:flex;
  align-items:center;justify-content:center;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;pointer-events:none}
.bgo{flex:1;background:var(--mint);color:#062015;font-weight:600}
.bre{background:var(--amberbg);color:var(--amber);border-color:#4A3A18}
.bno{background:var(--rosebg);color:var(--rose);border-color:#4A2020}
.bsk{background:var(--card2);color:var(--tx2);border-color:var(--line2)}
@media(max-width:560px){.btn{padding:12px 10px;font-size:12.5px;border-radius:12px}}

.flash{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(92px + env(safe-area-inset-bottom));z-index:60;padding:11px 18px;
  border-radius:100px;font-family:Sora,sans-serif;font-size:13px;
  background:var(--card2);border:1px solid var(--line2);opacity:0;
  pointer-events:none;transition:opacity .25s;max-width:calc(100vw - 32px)}
.flash.show{opacity:1}
.flash.bad{border-color:#4A2020;color:var(--rose)}

.fin{text-align:center;padding:56px 20px}
.fin h2{font-family:Sora,sans-serif;font-size:26px;font-weight:600;
  margin:0 0 8px;letter-spacing:-.02em}
.fin p{color:var(--tx2);margin:0 auto;max-width:340px}
.tick{width:56px;height:56px;border-radius:50%;margin:0 auto 20px;
  background:var(--mintbg);border:1px solid #235C40;color:var(--mint);
  display:grid;place-items:center;font-size:26px}

.back{background:none;border:1px solid var(--line2);color:var(--tx2);
  border-radius:10px;padding:8px 14px;cursor:pointer;font-family:Sora,sans-serif;
  font-size:12px;margin-bottom:16px}
.back:hover{border-color:var(--gold);color:var(--gold)}
.rtitle{font-family:Sora,sans-serif;font-size:20px;font-weight:600;
  margin:0 0 4px;letter-spacing:-.01em}
.rsub{color:var(--tx2);font-size:13.5px;margin:0 0 20px}

.rcard{background:var(--card);border:1px solid var(--line);
  border-left:2px solid var(--rose);border-radius:14px;padding:16px;margin-bottom:12px}
.rcard p{margin:0}
.rn{font-family:Sora,sans-serif;font-size:16px;font-weight:500}
.rw{font-size:11.5px;color:var(--tx3);margin-top:2px}
.rr{font-size:13.5px;color:var(--tx2);margin-top:10px}
.rq{font-size:13.5px;color:var(--tx2);margin-top:10px;padding:10px 12px;
  background:var(--card2);border-radius:10px;white-space:pre-wrap}
.undo{margin-top:12px;background:none;border:1px solid var(--line2);
  color:var(--tx);border-radius:10px;padding:8px 13px;cursor:pointer;
  font-family:Sora,sans-serif;font-size:12px}
.undo:hover{border-color:var(--gold);color:var(--gold)}

.arow{width:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-left:2px solid var(--mint);
  border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;
  display:flex;align-items:flex-start;gap:12px;font-family:inherit;color:inherit}
.arow:hover{border-color:var(--line2);border-left-color:var(--mint)}
.arow:active{transform:scale(.995)}
.apic{width:34px;height:34px;border-radius:11px;flex:none;background:var(--card2);
  border:1px solid var(--line2);display:grid;place-items:center;
  font-family:Sora,sans-serif;font-size:12px;font-weight:600;color:var(--mint)}
.atx{min-width:0;flex:1}
.ahead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.aname{font-family:Sora,sans-serif;font-size:15px;font-weight:500}
.achip{font-family:Sora,sans-serif;font-size:9px;letter-spacing:.1em;
  text-transform:uppercase;padding:2px 7px;border-radius:100px}
.chip-a{background:var(--amberbg);color:var(--amber)}
.chip-p{background:var(--mintbg);color:var(--mint)}
.chip-r{background:#0E2A2E;color:#6FD8E0}
.adate{font-size:11px;color:var(--tx3);font-family:'JetBrains Mono',monospace}
.asnip{font-size:13.5px;color:var(--tx2);margin:6px 0 0;overflow:hidden;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.achev{color:var(--tx3);font-size:16px;flex:none;align-self:center}
</style>
</head>
<body>

<div class="top">
  <div class="brand"><div class="mark">S</div><b>Review</b><span style="font-size:9px;color:#63636F;margin-left:6px;font-family:monospace">v6-recent-rw</span></div>
  <div class="pills">
    <button class="pill p-gold" id="qbtn"><b id="pcount">0</b><span>Rev</span></button>
    <button class="pill p-amber" id="ppbtn"><b id="ppcount">0</b><span>Post</span></button>
    <button class="pill p-cyan" id="rcbtn"><b id="rccount">0</b><span>Rcnt</span></button>
    <button class="pill p-mint" id="abtn"><b id="acount">0</b><span>Apprv</span></button>
    <button class="pill p-rose" id="rejbtn"><b id="rcount">0</b><span>Rjctd</span></button>
    <button class="sync" id="sync" aria-label="Reload">&#8635;</button>
  </div>
</div>

<div class="rail" id="rail"></div>
<div class="shell" id="stage"></div>

<div class="bar" id="bar" style="display:none">
  <div class="barin">
    <button class="btn bgo" data-a="approved">Approve &amp; post</button>
    <button class="btn bre" data-a="rewrite">Rewrite</button>
    <button class="btn bno" data-a="rejected">Don't</button>
    <button class="btn bsk" data-a="later">Later</button>
  </div>
</div>

<div class="flash" id="flash"></div>

<script>
var ENDPOINT = 'https://script.google.com/macros/s/AKfycbx6JNaX9xRLzggDHD4tRIB6G3rPykMDM0m-P-yc2W87OTMO5ji1PgpNuubUhmL8Cpul/exec';

var queue = [];
var rejected = [];
var postPending = [];
var recentList = [];
var posted = [];
var historyDays = 10;
var recentMinutes = 30;
var revisingCount = 0;

function recentLeft(iso){
  if(!iso){ return 'soon'; }
  var d = new Date(iso);
  if(isNaN(d.getTime())){ return 'soon'; }
  var mins = recentMinutes - Math.floor((Date.now() - d.getTime()) / 60000);
  if(mins <= 0){ return 'any moment'; }
  if(mins === 1){ return '1 min'; }
  return mins + ' min';
}
var idx = 0;
var approvedCount = 0;
var view = 'queue';
var detail = null;
var flashTimer;
var busy = false;

function el(id){ return document.getElementById(id); }

function esc(s){
  var d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

function countWords(s){
  var v = s.trim();
  return v ? v.split(/\s+/).length : 0;
}

function initials(n){
  var parts = String(n || '?').split(/\s+/);
  var out = '';
  for(var i = 0; i < parts.length && i < 2; i++){ out += parts[i].charAt(0); }
  return out.toUpperCase();
}

function fitColour(n){
  if(n >= 8){ return '#7BE0A8'; }
  if(n >= 5){ return '#F0B44A'; }
  return '#FF8080';
}

function copyText(text, done){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      done(true);
    }).catch(function(){
      done(fallbackCopy(text));
    });
  } else {
    done(fallbackCopy(text));
  }
}

function fallbackCopy(text){
  try {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    var ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch(e){
    return false;
  }
}

function niceDate(iso){
  if(!iso){ return 'no date'; }
  var d = new Date(iso);
  if(isNaN(d.getTime())){ return 'no date'; }
  var days = Math.floor((Date.now() - d.getTime()) / 86400000);
  if(days <= 0){ return 'today'; }
  if(days === 1){ return 'yesterday'; }
  return days + ' days ago';
}

function say(msg, bad){
  var f = el('flash');
  f.textContent = msg;
  f.className = bad ? 'flash show bad' : 'flash show';
  clearTimeout(flashTimer);
  flashTimer = setTimeout(function(){ f.className = 'flash'; }, 2600);
}

function counts(){
  el('pcount').textContent = Math.max(0, queue.length - idx);
  el('ppcount').textContent = postPending.length;
  el('rccount').textContent = recentList.length;
  el('acount').textContent = posted.length;
  el('rcount').textContent = rejected.length;

  el('qbtn').className = 'pill p-gold' + (view === 'queue' ? ' sel' : '');
  el('ppbtn').className = 'pill p-amber' + (view === 'postpending' ? ' sel' : '');
  el('rcbtn').className = 'pill p-cyan' + (view === 'recent' ? ' sel' : '');
  el('abtn').className = 'pill p-mint' + (view === 'posted' ? ' sel' : '');
  el('rejbtn').className = 'pill p-rose' + (view === 'rejected' ? ' sel' : '');
}

function drawRail(){
  if(view !== 'queue' || !queue.length){ el('rail').innerHTML = ''; return; }
  var out = '';
  for(var i = 0; i < queue.length; i++){
    var c = i < idx ? 'done' : (i === idx ? 'now' : '');
    out += '<i class="' + c + '"></i>';
  }
  el('rail').innerHTML = out;
}

function showState(title, body, showRetry, det){
  el('bar').style.display = 'none';
  el('rail').innerHTML = '';
  el('stage').innerHTML =
    '<div class="state"><h3>' + esc(title) + '</h3><p>' + esc(body) + '</p>' +
    (det ? '<code>' + esc(det) + '</code>' : '') +
    (showRetry ? '<button class="retry" id="rt">Try again</button>' : '') +
    '</div>';
  if(showRetry){ el('rt').addEventListener('click', load); }
}

function load(){
  if(ENDPOINT.indexOf('PASTE_YOUR') === 0){
    showState('Not connected', 'Set ENDPOINT near the top of the script.', false);
    return;
  }

  showState('Loading', 'Reading from your sheet.', false);

  fetch(ENDPOINT + '?action=list&t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d.ok){ throw new Error(d.error || 'Backend error'); }
      var allPending = d.pending || [];
      queue = allPending.filter(function(x){ return !x.revising; });
      revisingCount = allPending.length - queue.length;
      rejected = d.rejected || [];
      postPending = d.post_pending || [];
      recentList = d.recent || [];
      posted = d.posted || [];
      historyDays = d.history_days || 10;
      recentMinutes = d.recent_minutes || 30;
      idx = 0;
      approvedCount = 0;
      if(view !== 'postpending' && view !== 'posted' && view !== 'rejected'){ view = 'queue'; }
      detail = null;
      render();
    })
    .catch(function(err){
      showState('Could not reach the sheet',
        'Check the deployment access is set to Anyone.', true, String(err));
    });
}

function send(urn, action, comment, note){
  return fetch(ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ urn: urn, action: action, comment: comment, note: note || '' })
  })
  .then(function(r){ return r.json(); })
  .then(function(d){
    if(!d.ok){ throw new Error(d.error || 'Write failed'); }
    return d;
  });
}

function whoBlock(p){
  var col = fitColour(p.relevance);
  var seg = '';
  for(var i = 0; i < 10; i++){
    seg += i < p.relevance
      ? '<i class="on" style="background:' + col + '"></i>'
      : '<i></i>';
  }
  return '<div class="who">' +
    '<div class="pic">' + esc(initials(p.author)) + '</div>' +
    '<div class="whotx">' +
      '<p class="name">' + esc(p.author) + '</p>' +
      '<p class="role">' + esc(p.author_headline) + '</p>' +
      '<div class="meta">' +
        '<span class="when">' + esc(p.posted_when) + '</span>' +
        '<span class="fit"><span class="seg">' + seg + '</span>' +
          '<span class="fitn" style="color:' + col + '">' + p.relevance +
          '<small>/10 fit</small></span></span>' +
      '</div>' +
    '</div>' +
  '</div>';
}

var HEIGHT_MULT = 2.2;
var HEIGHT_MIN = 700;

function renderHeight(p){
  var base = Math.max(300, Number(p.embed_height) || 900);
  return Math.max(HEIGHT_MIN, Math.round(base * HEIGHT_MULT));
}

function embedPanel(p, withSizer){
  return '<div class="panel">' +
    '<div class="ph"><span>As it appears on LinkedIn</span>' +
      (withSizer ? '<span class="size">' +
        '<button id="shrink" aria-label="Shorter">&#8722;</button>' +
        '<em id="hval">' + p.embed_height + '</em>' +
        '<button id="grow" aria-label="Taller">+</button>' +
      '</span>' : '') +
    '</div>' +
    '<div class="framewrap">' +
      '<iframe class="frame" id="fr" title="Post by ' + esc(p.author) + '" ' +
        'style="height:' + renderHeight(p) + 'px" ' +
        'src="https://www.linkedin.com/embed/feed/update/' + esc(p.post_urn) + '"></iframe>' +
    '</div>' +
  '</div>';
}

function postToggle(p){
  return '<div class="panel">' +
    '<button class="toggle" id="tg"><span id="tgl">Read the full post</span><b id="tgi">+</b></button>' +
    '<div class="post" id="pt">' + esc(p.post_text) + '</div>' +
  '</div>';
}

function wireToggle(){
  var tg = el('tg');
  if(!tg){ return; }
  tg.addEventListener('click', function(){
    var pt = el('pt');
    var open = pt.className.indexOf('open') === -1;
    pt.className = open ? 'post open' : 'post';
    el('tgl').textContent = open ? 'Hide the post' : 'Read the full post';
    el('tgi').textContent = open ? '\u2212' : '+';
  });
}

function wireSizer(p){
  var g = el('grow');
  if(!g){ return; }
  function resize(delta){
    p.embed_height = Math.max(300, Number(p.embed_height) + delta);
    el('fr').style.height = renderHeight(p) + 'px';
    el('hval').textContent = p.embed_height;
  }
  g.addEventListener('click', function(){ resize(100); });
  el('shrink').addEventListener('click', function(){ resize(-100); });
}

/* ---------- review ---------- */

function renderQueue(){
  counts();
  drawRail();

  if(!queue.length){
    var msg = revisingCount
      ? revisingCount + ' being revised, back here in a few minutes.'
      : 'No pending rows right now.';
    showState('Nothing to review', msg, true);
    counts();
    return;
  }

  if(idx >= queue.length){
    el('bar').style.display = 'none';
    el('rail').innerHTML = '';
    var tail = revisingCount ? ' ' + revisingCount + ' being revised.' : '';
    el('stage').innerHTML =
      '<div class="fin"><div class="tick">&#10003;</div><h2>Queue cleared</h2><p>' +
      (postPending.length
        ? postPending.length + ' waiting in Post. Tap the Post tab to send them out.'
        : 'Nothing waiting. Next batch lands after the next run.') + tail +
      '</p></div>';
    window.scrollTo(0, 0);
    return;
  }

  el('bar').style.display = '';
  var p = queue[idx];

  el('stage').innerHTML =
    whoBlock(p) +
    '<div class="grid">' +
      '<div>' + embedPanel(p, true) + '</div>' +
      '<div class="right">' +
        '<div class="panel">' +
          '<div class="ph"><span>Why this one</span></div>' +
          '<div class="pb"><p class="why">' + esc(p.reason) + '</p></div>' +
        '</div>' +
        '<div class="panel">' +
          '<div class="ph"><span>Your comment</span><span class="cnt" id="cnt">&nbsp;</span></div>' +
          '<div class="pb"><textarea id="ta" aria-label="Your comment">' +
            esc(p.draft_comment) + '</textarea></div>' +
          '<div class="urn">' + esc(p.activity_urn) + '</div>' +
        '</div>' +
        postToggle(p) +
      '</div>' +
    '</div>';

  var ta = el('ta');
  var cnt = el('cnt');
  function upd(){
    var n = countWords(ta.value);
    cnt.textContent = n + ' / 40';
    cnt.className = n > 40 ? 'cnt over' : 'cnt';
  }
  ta.addEventListener('input', upd);
  upd();

  wireSizer(p);
  wireToggle();
  window.scrollTo(0, 0);
}

/* ---------- post pending and posted ---------- */

function cardData(kind){
  if(kind === 'posted'){ return posted; }
  if(kind === 'recent'){ return recentList; }
  return postPending;
}

function renderCardList(kind){
  counts();
  el('rail').innerHTML = '';
  el('bar').style.display = 'none';

  var list = cardData(kind);
  var rows = '';
  for(var i = 0; i < list.length; i++){
    var a = list[i];
    var chip;
    if(kind === 'posted'){ chip = '<span class="achip chip-p">posted</span>'; }
    else if(kind === 'recent'){ chip = '<span class="achip chip-r">posting</span>'; }
    else { chip = '<span class="achip chip-a">to post</span>'; }

    var when = kind === 'recent' ? recentLeft(a.recent_at) : niceDate(a.decided_at);

    rows +=
      '<button class="arow" data-i="' + i + '">' +
        '<span class="apic">' + esc(initials(a.author)) + '</span>' +
        '<span class="atx">' +
          '<span class="ahead"><span class="aname">' + esc(a.author) + '</span>' +
            chip + '<span class="adate">' + esc(when) + '</span></span>' +
          '<span class="asnip">' + esc(a.final_comment || a.draft_comment) + '</span>' +
        '</span>' +
        '<span class="achev">&#8250;</span>' +
      '</button>';
  }

  var title, sub;
  if(kind === 'posted'){
    title = 'Approved';
    sub = 'Comments already posted, last ' + historyDays + ' days. Tap one to verify it went out.';
  } else if(kind === 'recent'){
    title = 'Recent';
    sub = 'You opened these to post. They move to Approved automatically after ' +
          (recentMinutes || 30) + ' minutes. If a paste did not land, open it again from here.';
  } else {
    title = 'Post pending';
    sub = 'Approved and waiting to be posted. Tap one, copy the comment, open the post and paste it in.';
  }

  if(!rows){
    var empty = kind === 'posted' ? 'Nothing posted in the last ' + historyDays + ' days.'
              : kind === 'recent' ? 'Nothing in flight right now.'
              : 'Nothing waiting to post. Approve some in Review.';
    rows = '<p style="color:#9A9AA8">' + empty + '</p>';
  }

  el('stage').innerHTML =
    '<p class="rtitle">' + title + '</p><p class="rsub">' + sub + '</p>' + rows;

  var btns = el('stage').getElementsByClassName('arow');
  for(var j = 0; j < btns.length; j++){
    btns[j].addEventListener('click', function(){
      detail = cardData(kind)[Number(this.getAttribute('data-i'))];
      renderCardDetail(kind);
    });
  }

  window.scrollTo(0, 0);
}

function renderCardDetail(kind){
  counts();
  el('rail').innerHTML = '';
  el('bar').style.display = 'none';

  var p = detail;
  var isPosted = kind === 'posted';
  var isRecent = kind === 'recent';
  var edited = p.final_comment && p.draft_comment &&
               p.final_comment.trim() !== p.draft_comment.trim();
  var liveUrl = 'https://www.linkedin.com/feed/update/' + p.activity_urn + '/';
  var headLabel = isPosted ? 'What went out' : 'Comment to post';

  var rightButton;
  if(isPosted){
    rightButton = '<span class="donetag">&#10003; posted</span>';
  } else if(isRecent){
    rightButton = '<button class="pbtn pmark" id="marknow">Mark posted now</button>';
  } else {
    rightButton = '<span class="donetag" style="opacity:.6">moves to Recent</span>';
  }

  var hint;
  if(isPosted){
    hint = 'Already posted. Open the post to check the comment is live.';
  } else if(isRecent){
    hint = 'Waiting to auto-file in ' + recentLeft(p.recent_at) + '. If your paste did not land, tap copy and open again. Or mark it posted now to file it immediately.';
  } else {
    hint = 'Tap copy and open. It copies your comment, opens the post, and moves this into Recent so you can double check it landed.';
  }

  el('stage').innerHTML =
    '<button class="back" id="bk">&#8592; Back</button>' +
    whoBlock(p) +
    '<div class="grid">' +
      '<div>' + embedPanel(p, true) + '</div>' +
      '<div class="right">' +
        '<div class="panel">' +
          '<div class="ph"><span>' + headLabel + '</span>' +
            '<span class="cnt">' + esc(niceDate(p.decided_at)) + '</span></div>' +
          '<div class="pb">' +
            '<p class="said" id="saidtext">' + esc(p.final_comment || p.draft_comment) + '</p>' +
            (edited ? '<p class="wasdraft"><b>Claude had drafted</b>' +
              esc(p.draft_comment) + '</p>' : '') +
            '<div class="postrow">' +
              '<button class="pbtn pcopy" id="copyopen">Copy &amp; open post &#8599;</button>' +
              rightButton +
            '</div>' +
            '<p class="posthint" id="posthint">' + hint + '</p>' +
          '</div>' +
          '<div class="urn">' + esc(p.activity_urn) + '</div>' +
        '</div>' +
        '<div class="panel">' +
          '<div class="ph"><span>Why it was picked</span></div>' +
          '<div class="pb"><p class="why">' + esc(p.reason) + '</p></div>' +
        '</div>' +
        postToggle(p) +
      '</div>' +
    '</div>';

  el('bk').addEventListener('click', function(){
    detail = null;
    renderCardList(kind);
  });

  var commentText = p.final_comment || p.draft_comment;

  el('copyopen').addEventListener('click', function(){
    copyText(commentText, function(ok){
      el('posthint').textContent = ok
        ? 'Copied. Opening the post, long press the comment box and paste.'
        : 'Could not auto copy. Select the comment above and copy by hand, the post is opening now.';
      window.open(liveUrl, '_blank', 'noopener');

      // from Post pending, tapping copy-and-open files it into Recent
      if(!isPosted && !isRecent){
        fetch(ENDPOINT + '?action=torecent&urn=' + encodeURIComponent(p.activity_urn) + '&t=' + Date.now())
          .then(function(r){ return r.json(); })
          .then(function(d){
            if(d.ok){
              setTimeout(function(){
                say('Moved to Recent');
                detail = null;
                view = 'recent';
                load();
              }, 1500);
            }
          })
          .catch(function(){ /* opening the post still worked, ignore */ });
      }
    });
  });

  var markNow = el('marknow');
  if(markNow){
    markNow.addEventListener('click', function(){
      markNow.disabled = true;
      markNow.textContent = 'Filing...';
      fetch(ENDPOINT + '?action=markposted&urn=' + encodeURIComponent(p.activity_urn) + '&t=' + Date.now())
        .then(function(r){ return r.json(); })
        .then(function(d){
          if(!d.ok){ throw new Error(d.error || 'failed'); }
          say('Filed to Approved');
          detail = null;
          view = 'recent';
          load();
        })
        .catch(function(err){
          markNow.disabled = false;
          markNow.textContent = 'Mark posted now';
          say('Could not file: ' + err.message, true);
        });
    });
  }

  wireSizer(p);
  wireToggle();
  window.scrollTo(0, 0);
}

/* ---------- rejected ---------- */

function renderRejected(){
  counts();
  el('rail').innerHTML = '';
  el('bar').style.display = 'none';

  var rows = '';
  for(var i = 0; i < rejected.length; i++){
    var r = rejected[i];
    var why = r.dropped_by === 'filter'
      ? 'Dropped by the filter before it reached you.'
      : 'You decided not to comment on this one.';
    rows +=
      '<div class="rcard">' +
        '<p class="rn">' + esc(r.author) + '</p>' +
        '<p class="rw">' + esc(r.posted_when) + ' \u00b7 ' + esc(why) + '</p>' +
        '<p class="rr">' + esc(r.reason) + '</p>' +
        (r.final_comment ? '<p class="rq">' + esc(r.final_comment) + '</p>' : '') +
        '<button class="undo" data-urn="' + esc(r.activity_urn) + '">Put it back in the queue</button>' +
      '</div>';
  }

  if(!rows){ rows = '<p style="color:#9A9AA8">Nothing rejected yet.</p>'; }

  el('stage').innerHTML =
    '<p class="rtitle">Rejected</p>' +
    '<p class="rsub">Posts the filter dropped, plus the ones you passed on.</p>' + rows;

  var undos = el('stage').getElementsByClassName('undo');
  for(var j = 0; j < undos.length; j++){
    undos[j].addEventListener('click', function(){
      var btn = this;
      btn.disabled = true;
      btn.textContent = 'Putting back...';
      send(btn.getAttribute('data-urn'), 'pending', '')
        .then(function(){ say('Back in the queue'); load(); })
        .catch(function(err){
          btn.disabled = false;
          btn.textContent = 'Put it back in the queue';
          say('Could not update: ' + err.message, true);
        });
    });
  }

  window.scrollTo(0, 0);
}

function render(){
  if(view === 'rejected'){ renderRejected(); }
  else if(view === 'postpending'){ detail ? renderCardDetail('postpending') : renderCardList('postpending'); }
  else if(view === 'recent'){ detail ? renderCardDetail('recent') : renderCardList('recent'); }
  else if(view === 'posted'){ detail ? renderCardDetail('posted') : renderCardList('posted'); }
  else { renderQueue(); }
}

function setBusy(on){
  busy = on;
  var bs = el('bar').getElementsByTagName('button');
  for(var i = 0; i < bs.length; i++){ bs[i].disabled = on; }
}

function act(a){
  if(busy || view !== 'queue' || idx >= queue.length){ return; }
  var p = queue[idx];
  var ta = el('ta');
  var text = ta ? ta.value : '';

  if(a === 'later'){
    if(queue.length - idx < 2){ say('Nothing else waiting'); return; }
    queue.push(queue.splice(idx, 1)[0]);
    say('Moved to the back of the queue');
    renderQueue();
    return;
  }

  if(a === 'rewrite'){
    openRewrite(p);
    return;
  }

  setBusy(true);

  send(p.activity_urn, a, text)
    .then(function(){
      if(a === 'approved'){
        p.final_comment = text;
        p.status = 'approved';
        p.decided_at = new Date().toISOString();
        postPending.unshift(p);
        say('Approved. Waiting in Post.');
      } else {
        p.dropped_by = 'you';
        p.final_comment = text;
        rejected.push(p);
        say('Moved to rejected.');
      }
      idx++;
      setBusy(false);
      renderQueue();
    })
    .catch(function(err){
      setBusy(false);
      say('Not saved: ' + err.message, true);
    });
}

function openRewrite(p){
  var wrap = el('rewrite-modal');
  if(wrap){ wrap.parentNode.removeChild(wrap); }

  wrap = document.createElement('div');
  wrap.id = 'rewrite-modal';
  wrap.className = 'modal-back';
  wrap.innerHTML =
    '<div class="modal">' +
      '<div class="modal-h">Tell Claude what to change</div>' +
      '<p class="modal-sub">Your note goes back to the draft. It gets revised and returns to Review, usually within 15 minutes.</p>' +
      '<div class="modal-draft">' + esc(el('ta') ? el('ta').value : p.draft_comment) + '</div>' +
      '<textarea id="rwnote" placeholder="e.g. drop the telecom reference, make the question simpler, too formal, mention the pricing point instead"></textarea>' +
      '<div class="modal-row">' +
        '<button class="mbtn mcancel" id="rwcancel">Cancel</button>' +
        '<button class="mbtn msend" id="rwsend">Send for rewrite</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(wrap);
  el('rwnote').focus();

  el('rwcancel').addEventListener('click', function(){
    wrap.parentNode.removeChild(wrap);
  });

  el('rwsend').addEventListener('click', function(){
    var note = el('rwnote').value.trim();
    if(!note){ el('rwnote').focus(); return; }
    var btn = el('rwsend');
    btn.disabled = true;
    btn.textContent = 'Sending...';
    var curText = el('ta') ? el('ta').value : p.draft_comment;

    send(p.activity_urn, 'rewrite', curText, note)
      .then(function(){
        wrap.parentNode.removeChild(wrap);
        say('Sent for rewrite. Back in Review shortly.');
        idx++;
        renderQueue();
      })
      .catch(function(err){
        btn.disabled = false;
        btn.textContent = 'Send for rewrite';
        say('Could not send: ' + err.message, true);
      });
  });
}

el('qbtn').addEventListener('click', function(){
  view = 'queue'; detail = null; render();
});
el('ppbtn').addEventListener('click', function(){
  view = 'postpending'; detail = null; render();
});
el('rcbtn').addEventListener('click', function(){
  view = 'recent'; detail = null; render();
});
el('abtn').addEventListener('click', function(){
  view = 'posted'; detail = null; render();
});
el('rejbtn').addEventListener('click', function(){
  view = 'rejected'; detail = null; render();
});
el('sync').addEventListener('click', function(){
  var b = this;
  b.className = 'sync busy';
  load();
  setTimeout(function(){ b.className = 'sync'; }, 1200);
});

var barButtons = el('bar').getElementsByTagName('button');
for(var b = 0; b < barButtons.length; b++){
  barButtons[b].addEventListener('click', function(){
    act(this.getAttribute('data-a'));
  });
}

load();
</script>
</body>
</html>
